<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Maskable variant: the background is full-bleed (no rounded corners) because
    the platform supplies the shape, and the waveform is scaled down to sit
    inside the 80% safe zone so no mask can clip it.
  -->
  <rect width="512" height="512" fill="#15161c"/>
  <g fill="#a78bfa" transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <rect x="96" y="224" width="42" height="64" rx="21" opacity="0.45"/>
    <rect x="170" y="160" width="42" height="192" rx="21" opacity="0.7"/>
    <rect x="244" y="96" width="42" height="320" rx="21"/>
    <rect x="318" y="160" width="42" height="192" rx="21" opacity="0.7"/>
    <rect x="392" y="224" width="42" height="64" rx="21" opacity="0.45"/>
  </g>
</svg>

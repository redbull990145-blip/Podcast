name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tsconfig `extends` that fails to resolve does not error — TypeScript
      # falls back to bare compiler defaults in silence, and bare defaults mean
      # `strict: false`, which switches off narrowing of discriminated unions.
      # That shipped ten TS2339s in correct code to a deploy while every check
      # below stayed green, because they run from the repo root where the
      # extends always resolves. Asserting the *effective* config is the only
      # thing here that would have caught it.
      - name: Assert strict mode survives config resolution
        run: |
          for app in api web mobile; do
            npx tsc --showConfig -p "apps/$app" | grep -q '"strict": true' \
              || { echo "::error::strict mode lost in apps/$app — check the tsconfig extends chain"; exit 1; }
          done

      # Turbo runs these across the workspace graph and caches by input hash,
      # so an unchanged package is not rechecked.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Gates the pull request rather than the deploy: a bundle regression
      # should be argued with before it ships, but it is not a reason to block
      # a production release that is otherwise fine.
      - run: npm run budget --workspace @cue/web

  # Deploying the web app to Cloudflare Workers.
  #
  # Lives in this workflow rather than its own so that `needs: check` can gate
  # it on the suite above — on Vercel the deploy ran from a git integration
  # that had no idea whether anything passed, and a red build shipped anyway.
  #
  # Note the interaction with this workflow's `cancel-in-progress`: a second
  # push to main while a deploy is running cancels it. That is the intended
  # outcome — the newer commit's run supersedes it and deploys instead — and it
  # is safe because a `wrangler deploy` only becomes live once the upload
  # completes, so an interrupted one leaves the previous version serving.
  deploy-web:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `NEXT_PUBLIC_*` is inlined at build time, not read at runtime, so this
      # has to be present *here* rather than configured on the Cloudflare side.
      # Two things break quietly if it is missing: every client fetch falls back
      # to `http://localhost:8080`, and `apiOrigin()` in next.config.ts returns
      # null, which silently narrows the service worker's CSP to `'self'` and
      # stops it caching anything from the API.
      - name: Validate deployment inputs without printing credentials
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in NEXT_PUBLIC_API_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Required deployment input $name is unavailable."
              exit 1
            fi
          done
      - run: npm run deploy --workspace @cue/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

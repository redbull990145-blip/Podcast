name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Turbo runs these across the workspace graph and caches by input hash,
      # so an unchanged package is not rechecked.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

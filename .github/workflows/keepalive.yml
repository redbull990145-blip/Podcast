name: Keepalive

# Checkout needs read access; the probe calls only the public readiness URL.
permissions:
  contents: read

on:
  schedule:
    # Readiness touches Postgres as well as waking Render. Run off the busy
    # hour boundary. GitHub can delay or skip runs, so this reduces cold starts
    # without guaranteeing an always-awake API.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Touch the database
        env:
          # Public URLs can be repository variables. The default applies only
          # to this repository; forks must configure their own API endpoint.
          API_URL: ${{ vars.API_URL || vars.NEXT_PUBLIC_API_URL || secrets.API_URL || (github.repository == 'redbull990145-blip/Podcast' && 'https://podcast-68rl.onrender.com') || '' }}
        run: node scripts/keepalive.mjs

name: Supabase keepalive

# Free Supabase projects pause after 7 days without API traffic. A low-traffic
# app can hit that during development and come back to a dead database, so touch
# it twice a week.
#
# Requires repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY.

on:
  schedule:
    - cron: "0 6 * * 1,4" # Mondays and Thursdays, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL secret not set — skipping."
            exit 0
          fi
          # RLS denies the read, but the request still counts as activity.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/podcasts?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase responded $code"
          # Anything that reached the API keeps the project awake.
          case "$code" in 2*|4*) exit 0 ;; *) exit 1 ;; esac

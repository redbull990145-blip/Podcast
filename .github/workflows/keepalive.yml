name: Keepalive

# This job calls only the public API and does not need a GitHub credential.
permissions: {}

# Supabase pauses a free-tier project after 7 days with no activity, and
# unpausing is a manual click in their dashboard. A read every few days costs
# nothing and keeps the project awake.
on:
  schedule:
    # 06:00 UTC, twice a week — comfortably inside the 7-day window even if a
    # run is skipped, which GitHub does on repositories with no recent pushes.
    - cron: '0 6 * * 1,4'
    # Every 10 minutes, for Render rather than Supabase. A free Render service
    # sleeps after ~15 idle minutes and takes tens of seconds to wake, which
    # arrives as a request that hangs or 503s — the first person to open the app
    # after a quiet spell pays for it, and it reads as the app being broken.
    #
    # This reduces cold starts; it cannot remove them. GitHub delays and drops
    # scheduled runs when its shared runners are busy, and explicitly does not
    # guarantee the interval. A paid instance that never sleeps is the only
    # complete fix.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          # Fails the run rather than skipping it.
          #
          # This used to `exit 0` with a note, which meant a keepalive with no
          # `API_URL` secret reported success on every one of its runs while
          # doing nothing at all — the one failure mode you cannot notice,
          # because the workflow's whole job is to be invisible when it works.
          # Measured 2026-08-23: the API answered its first request in 52.9s,
          # a cold start this workflow exists to prevent, with a green tick on
          # every scheduled run behind it.
          #
          # A red X on a repository you own is the cheapest possible alarm. If
          # you are reading this in a fork and do not want the noise, delete
          # the workflow rather than restore the silent pass.
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL secret is not set — this keepalive is doing nothing."
            echo "Set it to the API's base URL (no trailing slash), e.g. https://podcast-68rl.onrender.com"
            echo "Without it: Render sleeps after ~15 idle minutes (~50s cold start for the"
            echo "next visitor), and a free Supabase project pauses after 7 idle days."
            exit 1
          fi

          # /health/ready runs a real query, which is what counts as activity.
          # /health would not touch Postgres at all.
          status=$(curl --silent --show-error --max-time 30 \
            --output /tmp/body --write-out '%{http_code}' \
            "$API_URL/health/ready")

          cat /tmp/body
          echo

          if [ "$status" != "200" ]; then
            echo "Readiness check returned $status"
            exit 1
          fi

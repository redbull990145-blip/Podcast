# Deploying the API.
#
# Render is named here because the plan picked it, but nothing in the service is
# Render-specific — it is a Node process that reads its configuration from the
# environment and listens on $PORT. Koyeb, Fly, or a container host take the
# same three commands.
#
# The web app is not in this file. It deploys to Vercel from the same repo with
# no config: root directory `apps/web`, and the environment variables under
# "Client → API" in .env.example.

services:
  - type: web
    name: cue-api
    runtime: node
    plan: free
    # Builds from the monorepo root: the API imports workspace packages by name,
    # so npm has to install the whole workspace for those links to resolve.
    rootDir: .
    buildCommand: npm ci && npm run build --workspace @cue/api
    startCommand: npm run start --workspace @cue/api

    # Liveness only. `/health/ready` touches the database, and a health check
    # that fails when Postgres blips would have the platform restart a process
    # that is working fine — turning a brief dependency outage into a crash loop.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # One Render load balancer sits in front. This decides whose address a
      # rate limit is counted against; see .env.example for why the number
      # matters in both directions.
      - key: TRUST_PROXY_HOPS
        value: 1

      # Everything below is a secret or an environment-specific URL, so it is
      # set in the dashboard rather than committed. `sync: false` is what makes
      # Render prompt for them instead of silently deploying without.
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_TOKEN
        sync: false
      - key: PODCASTINDEX_KEY
        sync: false
      - key: PODCASTINDEX_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: API_KEY_ENCRYPTION_SECRET
        sync: false

      # Email verification. Without RESEND_API_KEY the API still boots and
      # signs people up — it just never asks them to confirm an address, and
      # says so in the log at startup.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

# ---------------------------------------------------------------------------
# Running transcription on its own instance.
#
# Not required. The worker runs inside the API by default, and the jobs are
# durable either way — a restart costs a retry rather than the job.
#
# It becomes worth separating when transcription starts hurting the API, which
# it does by holding an entire episode in memory to walk its frame boundaries.
# On a small instance that is enough to get the process killed, and killing the
# API kills every request in flight with it. A second service gives that work
# its own memory, so the worst case is a transcript that retries rather than an
# outage.
#
# To do it: uncomment below, and set TRANSCRIBE_WORKER=off on the web service
# above so the work happens in exactly one place. Both need the same database
# and the same Groq key — the queue is the only thing they share. Note that
# Render's background workers are not on the free plan.
